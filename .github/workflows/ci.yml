name: CI
on:
  push:
    branches: [main, sviluppo]
  pull_request:
    branches: [main, sviluppo]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux image
        run: docker build -t traccia:ci .
      - name: Start isolated test container
        run: docker run -d --name traccia-ci -e AULALOCALE_TOKEN=ci-only-local-token-2026-traccia-test -p 127.0.0.1:18765:8765 traccia:ci
      - name: Verify startup, authentication and native runtimes
        shell: python
        run: |
          import json,time,urllib.request
          base='http://127.0.0.1:18765'
          for attempt in range(90):
              try:
                  assert json.load(urllib.request.urlopen(base+'/health',timeout=2))['status']=='ok'
                  break
              except Exception:
                  if attempt==89:raise
                  time.sleep(1)
          req=urllib.request.Request(base+'/api/v1/models',headers={'Authorization':'Bearer ci-only-local-token-2026-traccia-test'})
          data=json.load(urllib.request.urlopen(req,timeout=10))
          assert all(data['runtimes'].values()),data['runtimes']
          print(data['runtimes'])
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs traccia-ci || true
          docker rm -f traccia-ci || true
